name: Python environment
description: Install locked runtime dependencies in a project virtual environment.
inputs:
  requirements:
    description: Additional requirements file to install.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13.17'
        architecture: x64
        cache: pip
        cache-dependency-path: requirements*.txt
    - name: Create virtual environment
      shell: pwsh
      run: |
        python -m venv .venv
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Join-Path $env:GITHUB_WORKSPACE '.venv/Scripts' >> $env:GITHUB_PATH
    - name: Install dependencies
      shell: pwsh
      env:
        EXTRA_REQUIREMENTS: ${{ inputs.requirements }}
      run: |
        python -m pip install -r requirements.lock.txt -r $env:EXTRA_REQUIREMENTS
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python -m pip check
